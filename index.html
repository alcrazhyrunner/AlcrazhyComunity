<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <aside class="sidebar">
    <div class="logo">
      
      <svg viewBox="0 0 24 24" width="24" height="24">
    <path d="M3 10.5L12 3l9 7.5V21H3V10.5Z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"/>
    <path d="M9 21v-6h6v6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"/>
        
      </svg>
      
    </div>
    
  </aside>

  <main> 
    
    <div class="banner">
      <img src="png/banner.png" alt="banner">
    </div>

    <header class="title">
      <h1>Alcrazhy Community ❯</h1>
    </header>

    <div class="search">
    <svg viewBox="0 0 24 24" width="24" height="25">
        <circle cx="11" cy="11" r="7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>
        <line x1="16" y1="16" x2="21" y2="21"
              stroke="currentColor"
              stroke-width="2"/>
    </svg>

    <span>Search</span>
    </div>

    <nav class="profile-bar" id="profileButton">
    <div class="profile-left">
      
    <div class="profile-avatar">
      <img src="png/avatar.png" alt="Avatar">
    </div>
    
        <span class="profile-name">My Profile</span>
    </div>

    <span class="profile-arrow">❯</span>
    </nav>

    <section class="profile-screen" id="profileScreen">
    <div class="panel-handle"></div>

      <button class="close-profile" id="closeProfile">X</button>

    <div class="profile-header">
        <div class="profile-header-avatar">
          <img src="png/profile-header.png" alt="header">
        </div>

        <div class="profile-info">
            <h2>
            </h2>
            <p>Nama  : Adhitya Dhimas Pradana</p>
            <p>Absen : 02</p>
            <p>Kelas : TJKT 1</p>
        </div>
    </div>

    <button class="edit-profile">
        ✎ Edit Profile
    </button>

    <div class="profile-tabs">
        <button class="tab active">Main</button>
        <button class="tab">Wishlist</button>
    </div>

    <div class="profile-content">
        <div class="profile-card">
            <h3>Amp up your profile</h3>

            <div class="profile-actions">
                <button>◉ Get Nitro</button>
                <button>▦ Shop</button>
            </div>
        </div>

        <div class="profile-card balance">
            <span>Orbs Balance</span>
            <button>◇ Try Orbs</button>
        </div>

        <div class="profile-detail">
            <p>Member Since</p>
            <strong>◉ Mar 27, 2026</strong>
        </div>

        <button class="profile-link">Friends　›</button>

        <div class="profile-detail">
            <p>Note (only visible to you)</p>
        </div>
    </div>
    </section>

    <script src="script.js"></script>

</body>
</html>
